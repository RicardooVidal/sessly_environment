networks:
  sessly:
    driver: bridge

services:

  db:
    image: postgres:14
    container_name: db_sessly
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sessly
    tty: true
    restart: unless-stopped
    ports:
      - 5433:5432/tcp
    volumes: 
      - ../media/postgres_data:/var/lib/postgresql/data
    networks:
      - sessly
    
  redis:
    image: redis:7-alpine
    container_name: redis_sessly
    restart: unless-stopped
    ports:
      - 6380:6379
    networks:
      - sessly

  api:
    build:
      context: ./sessly_api
      dockerfile: Dockerfile.local
    container_name: api_sessly
    tty: true
    ports:
      - 8882:8882/tcp
    depends_on:
      - db
    volumes:
      - ./sessly_api/:/var/www/html
      - ../media/sessly_files:/var/www/html/storage/app/public
    networks:
      - sessly

  frontend:
    build:
      context: ./sessly
      dockerfile: Dockerfile.local
    container_name: front_sessly
    tty: true
    environment:
      - NODE_ENV=development
    ports:
      - 5173:5173/tcp
    depends_on:
      - api
    volumes:
      - "./sessly/:/app"
    env_file:
      ./sessly/.env
    networks:
      - sessly
